name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Test
        env:
          # This environment variable is required by the receipt chain unit tests.
          # It is NOT a real secret. Production deployments load the HMAC key from
          # a runtime-provided ALETHEIA_RECEIPT_SECRET or an external secret manager.
          # The value below is a deterministic test fixture so CI runs deterministically
          # and forks can run the test suite without additional setup.
          # See SECURITY.md for vulnerability reporting.
          ALETHEIA_RECEIPT_SECRET: TEST_FIXTURE_NOT_A_REAL_HMAC_KEY_DO_NOT_FLAG_AS_SECRET
        run: pytest

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit semgrep
      - name: Bandit (HIGH severity only)
        run: bandit -r src/ --severity-level high
      - name: Semgrep
        run: semgrep --config=auto src/ --error
